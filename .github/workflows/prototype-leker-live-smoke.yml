name: Prototype Leker Live Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prototype-leker-live-smoke.yml'
      - 'live-smoke-requests/prototype-leker-*.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: https://prototype-leker-v2.daily-napkin.workers.dev

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose live HTTP response
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          get_url() {
            local path="$1"
            local slug="$2"
            local status
            status="$(curl -sSL -A "$UA" -D "/tmp/${slug}.headers" -o "/tmp/${slug}.body" -w '%{http_code}' "$BASE_URL$path")"
            echo "=== $path status=$status ==="
            if [ "$status" -ge 400 ]; then
              cat "/tmp/${slug}.headers"
              head -c 1200 "/tmp/${slug}.body" || true
              exit 22
            fi
          }

          get_url '/customer' 'customer'
          get_url '/cashier' 'cashier'
          get_url '/s/G001/admin' 'admin'
          get_url '/admin-master-menu.js' 'master-menu'
          get_url '/admin-accounting-workspace.js' 'accounting-workspace'
          get_url '/admin-accounting-settings-comfort.js' 'accounting-settings-comfort'
          get_url '/__d1-migrations.txt' 'd1-migrations'
          get_url '/__d1-time-travel.json' 'd1-time-travel'
          get_url '/__d1-accounting-legacy-schema.json' 'd1-accounting-legacy-schema'
          get_url '/__d1-account-refs-schema.json' 'd1-account-refs-schema'
          get_url '/__d1-mappings-schema.json' 'd1-mappings-schema'
          get_url '/__d1-snapshot-schema.json' 'd1-snapshot-schema'
          get_url '/api/menu' 'menu'

          echo '=== D1 MIGRATIONS ==='
          cat /tmp/d1-migrations.body
          echo
          echo '=== D1 TIME TRAVEL INFO ==='
          cat /tmp/d1-time-travel.body
          echo
          echo '=== LEGACY ACCOUNTING SCHEMA ==='
          cat /tmp/d1-accounting-legacy-schema.body
          echo
          echo '=== ACCOUNT REFS COLUMNS ==='
          cat /tmp/d1-account-refs-schema.body
          echo
          echo '=== MAPPINGS COLUMNS ==='
          cat /tmp/d1-mappings-schema.body
          echo
          echo '=== SNAPSHOT COLUMNS ==='
          cat /tmp/d1-snapshot-schema.body
          echo

          grep -q '/admin-accounting-workspace.js' /tmp/admin.body
          grep -q '/admin-accounting-settings-comfort.js' /tmp/admin.body
          grep -q 'Buat Jurnal' /tmp/accounting-workspace.body
          grep -q 'Buku Besar' /tmp/accounting-workspace.body
          grep -q 'Rugi Laba' /tmp/accounting-workspace.body
          grep -q 'Neraca' /tmp/accounting-workspace.body
          grep -q 'Aturan Transaksi' /tmp/accounting-settings-comfort.body
          grep -q 'acc-columns' /tmp/accounting-settings-comfort.body
          jq -e 'type == "array" and length > 0' /tmp/menu.body >/dev/null

          echo 'LIVE_HTTP_DIAGNOSTIC_PASS'
