name: Prototype Leker Live Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prototype-leker-live-smoke.yml'
      - 'live-smoke-requests/prototype-leker-*.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: https://prototype-leker-v2.daily-napkin.workers.dev

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose live HTTP response
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          check_url() {
            local path="$1"
            local slug="$2"
            local status
            status="$(curl -sSL -A "$UA" -D "/tmp/${slug}.headers" -o "/tmp/${slug}.body" -w '%{http_code}' "$BASE_URL$path")"
            echo "=== $path status=$status ==="
            cat "/tmp/${slug}.headers"
            echo '--- body preview ---'
            head -c 1200 "/tmp/${slug}.body" || true
            echo
            if [ "$status" -ge 400 ]; then
              exit 22
            fi
          }

          check_url '/customer' 'customer'
          check_url '/cashier' 'cashier'
          check_url '/s/G001/admin' 'admin'
          check_url '/admin-master-menu.js' 'master-menu'
          check_url '/admin-accounting-workspace.js' 'accounting-workspace'
          check_url '/admin-accounting-settings-comfort.js' 'accounting-settings-comfort'
          check_url '/__d1-migrations.txt' 'd1-migrations'
          check_url '/__d1-snapshot-schema.json' 'd1-snapshot-schema'
          check_url '/__d1-target-schema.json' 'd1-target-schema'
          check_url '/api/menu' 'menu'

          echo '=== FULL D1 MIGRATION DIAGNOSTIC ==='
          cat /tmp/d1-migrations.body
          echo
          echo '=== FULL SNAPSHOT TABLE SCHEMA ==='
          cat /tmp/d1-snapshot-schema.body
          echo
          echo '=== FULL TARGET SCHEMA ==='
          cat /tmp/d1-target-schema.body
          echo

          grep -q '/cashier-sales-orders.js' /tmp/cashier.body
          grep -q '/cashier-approval-actions.js' /tmp/cashier.body
          grep -q '/admin-master-menu.js' /tmp/admin.body
          grep -q '/admin-stock.js' /tmp/admin.body
          grep -q '/admin-transactions-ui.js' /tmp/admin.body
          grep -q '/admin-accounting-workspace.js' /tmp/admin.body
          grep -q '/admin-accounting-settings-comfort.js' /tmp/admin.body
          grep -q 'Buat Jurnal' /tmp/accounting-workspace.body
          grep -q 'Buku Besar' /tmp/accounting-workspace.body
          grep -q 'Rugi Laba' /tmp/accounting-workspace.body
          grep -q 'Neraca' /tmp/accounting-workspace.body
          grep -q 'Aturan Transaksi' /tmp/accounting-settings-comfort.body
          grep -q 'acc-columns' /tmp/accounting-settings-comfort.body
          grep -q 'document.body.appendChild(panel)' /tmp/master-menu.body
          grep -q 'admin-master-menu-panel{position:fixed' /tmp/master-menu.body
          jq -e 'type == "array" and length > 0' /tmp/menu.body >/dev/null

          echo 'LIVE_HTTP_DIAGNOSTIC_PASS'
