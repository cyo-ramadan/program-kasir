name: Prototype Leker Live Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prototype-leker-live-smoke.yml'
      - 'live-smoke-requests/prototype-leker-*.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: https://prototype-leker-v2.daily-napkin.workers.dev

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live Prototype Leker Accounting
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          expect_200() {
            local path="$1"
            local slug="$2"
            local status
            status="$(curl -sSL -A "$UA" -o "/tmp/${slug}.body" -w '%{http_code}' "$BASE_URL$path")"
            echo "$path => $status"
            test "$status" = "200"
          }

          expect_401() {
            local path="$1"
            local slug="$2"
            local status
            status="$(curl -sSL -A "$UA" -o "/tmp/${slug}.body" -w '%{http_code}' "$BASE_URL$path")"
            echo "$path => $status"
            test "$status" = "401"
          }

          expect_absent() {
            local path="$1"
            local slug="$2"
            local status
            status="$(curl -sSL -A "$UA" -o "/tmp/${slug}.body" -w '%{http_code}' "$BASE_URL$path")"
            echo "$path => $status"
            test "$status" = "404"
          }

          expect_200 '/customer' 'customer'
          expect_200 '/cashier' 'cashier'
          expect_200 '/s/G001/admin' 'admin'
          expect_200 '/admin-accounting-workspace.js' 'accounting-workspace'
          expect_200 '/admin-accounting-settings-comfort.js' 'accounting-settings-comfort'
          expect_200 '/api/menu' 'menu'

          grep -q '/admin-accounting-workspace.js' /tmp/admin.body
          grep -q '/admin-accounting-settings-comfort.js' /tmp/admin.body
          grep -q 'Data Akun' /tmp/accounting-workspace.body
          grep -q 'Buat Jurnal' /tmp/accounting-workspace.body
          grep -q 'Data Jurnal' /tmp/accounting-workspace.body
          grep -q 'Buku Besar' /tmp/accounting-workspace.body
          grep -q 'Rugi Laba' /tmp/accounting-workspace.body
          grep -q 'Neraca' /tmp/accounting-workspace.body
          grep -q 'Aturan Transaksi' /tmp/accounting-settings-comfort.body
          grep -q 'acc-columns' /tmp/accounting-settings-comfort.body
          jq -e 'type == "array" and length > 0' /tmp/menu.body >/dev/null

          # Protected Accounting APIs must exist and stop at authentication, not fail with schema/runtime 5xx.
          expect_401 '/api/admin/settings/accounting' 'accounting-settings-api'
          expect_401 '/api/admin/accounting' 'accounting-workspace-api'
          expect_401 '/api/admin/accounting/journals' 'accounting-journals-api'

          # Temporary production diagnostics used during D1 recovery must not remain publicly served.
          expect_absent '/__d1-time-travel.json' 'd1-time-travel'
          expect_absent '/__d1-accounting-legacy-schema.json' 'd1-legacy-schema'
          expect_absent '/__d1-migrations.txt' 'd1-migrations'

          echo 'LIVE_ACCOUNTING_SMOKE_PASS'
