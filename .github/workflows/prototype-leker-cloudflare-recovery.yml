name: Prototype Leker Cloudflare Recovery

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-requests/prototype-leker-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-leker-cloudflare-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Backup, migrate, deploy, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://prototype-leker-v2.daily-napkin.workers.dev
    steps:
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Check out Prototype Leker
        uses: actions/checkout@v4
        with:
          repository: cyo-ramadan/prototype-leker
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Quality gate
        run: npm run check && npm test

      - name: Export remote D1 backup
        run: npx --yes wrangler d1 export DB --remote --output prototype-leker-db-before-accounting-recovery.sql

      - name: Preserve D1 backup
        uses: actions/upload-artifact@v4
        with:
          name: prototype-leker-db-before-accounting-recovery-${{ github.run_id }}
          path: prototype-leker-db-before-accounting-recovery.sql
          retention-days: 30

      - name: Apply remote D1 migrations
        run: npx --yes wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        run: npx --yes wrangler deploy

      - name: Verify Accounting assets and API boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/accounting-settings-boundary.js" |
            grep -q 'node.textContent !== value'
          curl --fail --silent --show-error "$WORKER_URL/admin-accounting-workspace.js" >/dev/null
          status="$(curl --silent --output /tmp/accounting-api.json --write-out '%{http_code}' "$WORKER_URL/api/admin/settings/accounting")"
          test "$status" = "401"
          grep -q 'Login Owner atau Admin Gerai diperlukan' /tmp/accounting-api.json
