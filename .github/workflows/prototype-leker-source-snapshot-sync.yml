name: Prototype Leker Source Snapshot Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prototype-leker-source-snapshot-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.MAXI_REPO_CREATOR_TOKEN }}
    steps:
      - name: Check out tooling repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync canonical Prototype Leker into tooling snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Missing MAXI_REPO_CREATOR_TOKEN'; exit 1; }

          WORK_DIR="$RUNNER_TEMP/prototype-leker-canonical"
          rm -rf "$WORK_DIR"
          git clone --branch main --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/cyo-ramadan/prototype-leker.git" \
            "$WORK_DIR"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.publisher-state.json' \
            "$WORK_DIR/" \
            "$GITHUB_WORKSPACE/source-payloads/prototype-leker/"

          cd "$GITHUB_WORKSPACE/source-payloads/prototype-leker"
          npm test
          npm run check

      - name: Commit refreshed tooling snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAXI Prototype Snapshot Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add source-payloads/prototype-leker/

          if git diff --cached --quiet; then
            echo 'Prototype Leker tooling snapshot already matches canonical main.'
            exit 0
          fi

          git commit -m 'chore: sync Prototype Leker tooling snapshot from canonical main'
          git pull --rebase
          git push
