name: MAXI Repository Creator

on:
  push:
    branches:
      - main
    paths:
      - "repo-requests/*.json"

permissions:
  contents: write

jobs:
  create-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out request
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Create repository and record result
        env:
          GH_TOKEN: ${{ secrets.MAXI_REPO_CREATOR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^repo-requests/.*\.json$' | head -n 1)"
          test -n "$REQUEST_FILE"

          REPOSITORY_NAME="$(jq -r '.repositoryName' "$REQUEST_FILE")"
          VISIBILITY="$(jq -r '.visibility // "private"' "$REQUEST_FILE")"
          DESCRIPTION="$(jq -r '.description // ""' "$REQUEST_FILE")"

          [[ "$REPOSITORY_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$VISIBILITY" == "private" || "$VISIBILITY" == "public" ]]
          test -n "$GH_TOKEN"

          if [[ "$VISIBILITY" == "private" ]]; then
            PRIVATE_VALUE=true
          else
            PRIVATE_VALUE=false
          fi

          jq -n --arg name "$REPOSITORY_NAME" --arg description "$DESCRIPTION" --argjson private "$PRIVATE_VALUE"             '{name: $name, description: $description, private: $private, auto_init: false}' > api-request.json

          HTTP_STATUS="$(curl --silent --show-error --output api-response.json --write-out '%{http_code}'             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer $GH_TOKEN"             --header "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/user/repos             --data-binary @api-request.json)"

          mkdir -p repo-results
          jq -n             --arg repositoryName "$REPOSITORY_NAME"             --arg httpStatus "$HTTP_STATUS"             --argjson response "$(cat api-response.json)"             '{repositoryName: $repositoryName, httpStatus: $httpStatus, response: $response}'             > "repo-results/$GITHUB_RUN_ID.json"

          git config user.name "MAXI Repository Creator"
          git config user.email "actions@users.noreply.github.com"
          git add "repo-results/$GITHUB_RUN_ID.json"
          git commit -m "chore: record repository creation result"
          git push

          [[ "$HTTP_STATUS" == "201" ]]
