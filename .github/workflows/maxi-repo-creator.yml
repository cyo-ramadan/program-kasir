name: MAXI Repository Creator

on:
  push:
    branches:
      - main
    paths:
      - "repo-requests/*.json"

permissions:
  contents: write

jobs:
  create-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out request
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Create repository
        env:
          GH_TOKEN: ${{ secrets.MAXI_REPO_CREATOR_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          import subprocess
          from pathlib import Path

          result = {"success": False, "stage": "initialization"}
          result_path = Path("repo-results") / f"{os.environ['GITHUB_RUN_ID']}.json"
          result_path.parent.mkdir(parents=True, exist_ok=True)

          try:
              changed_files = subprocess.check_output(
                  ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD", "--", "repo-requests"],
                  text=True,
              ).splitlines()
              request_files = [Path(path) for path in changed_files if path.endswith(".json")]
              if not request_files:
                  raise RuntimeError("REQUEST_FILE_NOT_FOUND")

              request_data = json.loads(request_files[-1].read_text())
              repository_name = request_data.get("repositoryName", "")
              visibility = request_data.get("visibility", "private")
              description = request_data.get("description", "")

              result.update({
                  "stage": "validation",
                  "requestFile": str(request_files[0]),
                  "repositoryName": repository_name,
                  "visibility": visibility,
              })

              if not re.fullmatch(r"[A-Za-z0-9._-]+", repository_name):
                  raise RuntimeError("INVALID_REPOSITORY_NAME")
              if visibility not in {"private", "public"}:
                  raise RuntimeError("INVALID_VISIBILITY")

              token = os.environ.get("GH_TOKEN", "")
              if not token:
                  raise RuntimeError("SECRET_NOT_AVAILABLE")

              payload = json.dumps({
                  "name": repository_name,
                  "description": description,
                  "private": visibility == "private",
                  "auto_init": False,
              }).encode()

              api_request = urllib.request.Request(
                  "https://api.github.com/user/repos",
                  data=payload,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )

              result["stage"] = "github_api"
              try:
                  with urllib.request.urlopen(api_request) as response:
                      response_data = json.loads(response.read())
                      result.update({
                          "success": response.status == 201,
                          "httpStatus": response.status,
                          "repositoryUrl": response_data.get("html_url"),
                      })
              except urllib.error.HTTPError as error:
                  error_data = json.loads(error.read() or b"{}")
                  result.update({
                      "httpStatus": error.code,
                      "error": error_data.get("message", "GITHUB_API_ERROR"),
                  })

          except Exception as error:
              result["error"] = str(error)
          finally:
              result_path.write_text(json.dumps(result, indent=2) + "\n")

          if not result["success"]:
              sys.exit(1)
          PY

      - name: Publish sanitized result
        if: always()
        shell: bash
        run: |
          git config user.name "MAXI Repository Creator"
          git config user.email "actions@users.noreply.github.com"
          git add repo-results/
          git commit -m "chore: record repository creation result" || exit 0
          git push
