name: MAXI Repository Creator

on:
  push:
    branches:
      - main
    paths:
      - "repo-requests/*.json"

permissions:
  contents: read

jobs:
  create-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out request
        uses: actions/checkout@v4

      - name: Read and validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^repo-requests/.*\.json$' | head -n 1)"
          test -n "$REQUEST_FILE"
          REPOSITORY_NAME="$(jq -r '.repositoryName' "$REQUEST_FILE")"
          VISIBILITY="$(jq -r '.visibility // "private"' "$REQUEST_FILE")"
          DESCRIPTION="$(jq -r '.description // ""' "$REQUEST_FILE")"
          [[ "$REPOSITORY_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$VISIBILITY" == "private" || "$VISIBILITY" == "public" ]]
          echo "repository_name=$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"
          echo "visibility=$VISIBILITY" >> "$GITHUB_OUTPUT"
          {
            echo "description<<MAXI_EOF"
            echo "$DESCRIPTION"
            echo "MAXI_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create repository
        env:
          GH_TOKEN: ${{ secrets.MAXI_REPO_CREATOR_TOKEN }}
          REPOSITORY_NAME: ${{ steps.request.outputs.repository_name }}
          VISIBILITY: ${{ steps.request.outputs.visibility }}
          DESCRIPTION: ${{ steps.request.outputs.description }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VISIBILITY" == "private" ]]; then
            PRIVATE_VALUE=true
          else
            PRIVATE_VALUE=false
          fi
          jq -n             --arg name "$REPOSITORY_NAME"             --arg description "$DESCRIPTION"             --argjson private "$PRIVATE_VALUE"             '{name: $name, description: $description, private: $private, auto_init: false}'             > request.json
          curl --fail-with-body --silent --show-error             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer $GH_TOKEN"             --header "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/user/repos             --data-binary @request.json
