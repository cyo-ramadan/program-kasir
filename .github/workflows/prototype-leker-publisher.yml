name: Prototype Leker Publisher

on:
  push:
    branches: [main]
    paths:
      - "prototype-leker-requests/*.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MAXI tooling repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate and publish Prototype Leker source
        env:
          GH_TOKEN: ${{ secrets.MAXI_REPO_CREATOR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RESULT_DIR="$GITHUB_WORKSPACE/prototype-leker-results"
          RESULT_FILE="$RESULT_DIR/$GITHUB_RUN_ID.json"
          WORK_DIR="$RUNNER_TEMP/prototype-leker"
          REPO_URL="https://github.com/cyo-ramadan/prototype-leker"

          mkdir -p "$RESULT_DIR"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          cp -R "$GITHUB_WORKSPACE/source-payloads/prototype-leker/." "$WORK_DIR/"

          cd "$WORK_DIR"
          test -f wrangler.jsonc
          test -f src/index.js
          test -f package.json

          npm test
          npm run check

          git init -b main
          git config user.name "MAXI Prototype Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "feat: publish Prototype Leker"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/cyo-ramadan/prototype-leker.git"
          git push --force -u origin main

          export RESULT_FILE REPO_URL
          python3 - <<'PY'
          import json, os
          payload = {
              "success": True,
              "stage": "source_published",
              "error": None,
              "repositoryUrl": os.environ["REPO_URL"],
              "liveUrl": None,
              "deployment": "Managed separately in the permanent Cloudflare account"
          }
          with open(os.environ["RESULT_FILE"], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY

      - name: Publish sanitized result
        if: always()
        shell: bash
        run: |
          git config user.name "MAXI Prototype Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add prototype-leker-results/
          git commit -m "chore: record Prototype Leker publish result" || exit 0
          git pull --rebase
          git push
