name: Cloudflare Credential Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-diagnostic-requests/*.json'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured Cloudflare secret names
        env:
          CF_API_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN }}
          CF_API_TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ACCOUNT_ID_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          present() { if [ -n "$2" ]; then echo "$1=PRESENT"; else echo "$1=MISSING"; fi; }
          present CLOUDFLARE_API_TOKEN "$CF_API_TOKEN_1"
          present CF_API_TOKEN "$CF_API_TOKEN_2"
          present CLOUDFLARE_TOKEN "$CF_API_TOKEN_3"
          present CLOUDFLARE_ACCOUNT_ID "$CF_ACCOUNT_ID_1"
          present CF_ACCOUNT_ID "$CF_ACCOUNT_ID_2"
